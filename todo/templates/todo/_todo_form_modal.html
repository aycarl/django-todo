<div class="modal is-active" id="todo-modal">
    <div class="modal-background" hx-target="#modal-container" hx-swap="innerHTML" hx-trigger="click"></div>
    <div class="modal-card">
        <header class="modal-card-head">
            <p class="modal-card-title">Create New Todo</p>
            <button class="delete" 
                    aria-label="close"
                    hx-target="#modal-container" 
                    hx-swap="innerHTML"></button>
        </header>
        <section class="modal-card-body">
            <form hx-post="{% url 'todo:create_todo' %}" 
                  hx-target="#todo-list" 
                  hx-swap="innerHTML"
                  hx-on="htmx:afterRequest: if(event.detail.successful) { document.getElementById('modal-container').innerHTML = '' }">
                {% csrf_token %}
                <div class="field">
                    <label class="label" for="modal-title">Title</label>
                    <div class="control">
                        <input class="input" 
                               type="text" 
                               id="modal-title" 
                               name="title" 
                               placeholder="What needs to be done?"
                               required 
                               autofocus>
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="modal-content">Description</label>
                    <div class="control">
                        <textarea id="modal-content" 
                                  class="textarea" 
                                  name="content" 
                                  placeholder="Add more details..."></textarea>
                    </div>
                </div>
                <div class="field is-grouped is-grouped-right">
                    <div class="control">
                        <button class="button" 
                                type="button"
                                hx-target="#modal-container" 
                                hx-swap="innerHTML">
                            Cancel
                        </button>
                    </div>
                    <div class="control">
                        <button class="button is-primary" type="submit">
                            Create Todo
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</div>
