<div id="todo-item-{{ todo.id }}">
    <input aria-label="Toggle todo"
           type="checkbox"
           name="completed"
           hx-post="{% url 'todo:toggle' todo.id %}"
           hx-target="#todo-list"
           hx-swap="innerHTML"
           {% if todo.completed %}checked{% endif %}
    />
    <div class="is-inline-block {% if todo.completed %}has-text-grey-light is-italic{% endif %}"
         {% if todo.completed %}
             style="text-decoration: line-through;"
         {% endif %}>
        <h3 class="has-text-weight-medium">{{ todo.title }}</h3>
        <p>{{ todo.content }}</p>
    </div>
    <button class="button is-danger is-small ml-2"
            hx-delete="{% url 'todo:delete_todo' todo.id %}"
            hx-target="#todo-item-{{ todo.id }}"
            hx-swap="outerHTML"
            hx-confirm="Are you sure you want to delete this todo?">
        Delete
    </button>
</div>
